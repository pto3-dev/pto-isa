<text x="56" y="528" class="procTitle">Procedure (conceptual)</text>
<text x="56" y="554" class="procText" xml:space="preserve">
  <tspan x="56" dy="0">TEXTRACT places HiF4 data in L0A/L0B and scale patches in L0AMX/L0BMX.</tspan>
  <tspan x="56" dy="16">Each 64B scale patch carries Ea/Eb and Ec metadata for 64-value groups.</tspan>
  <tspan x="56" dy="16">mad_mx(hifloat4x2_t) applies the three-level scale inside Cube.</tspan>
  <tspan x="56" dy="16">Accumulate into L0C as FP32; TSTORE/FIXPIPE may cast the result to BF16.</tspan>
</text>
<text x="56" y="680" class="meta">Note: semantics apply to the valid region unless stated otherwise.</text>
