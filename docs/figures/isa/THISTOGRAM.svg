<text x="40" y="46" class="title">THISTOGRAM</text>
<text x="40" y="72" class="subtitle">Per-byte histogram (256 bins) over a selected byte of each source element, with optional cascaded upper-byte filtering; the radix-sort bucket-count primitive.</text>
<text x="40" y="92" class="meta">Template: complex</text>
<text x="1160" y="92" class="meta" text-anchor="end">Legend: outline=example; dashed=valid rows/cols (Rv,Cv); shaded=masked; r down / c right; ortho arrows=dataflow</text>
<line x1="36" y1="104" x2="1164" y2="104" stroke="#e2e8f0" stroke-width="1.5" />
<text x="600" y="140" class="subtitle" text-anchor="middle" fill="#C53A79">dst[row,bin] = cumulative_count(selected_byte(src[row,*]) &lt;= bin)</text>
