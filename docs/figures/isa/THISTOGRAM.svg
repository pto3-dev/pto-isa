<text x="56" y="528" class="procTitle">Procedure (conceptual)</text>
<text x="56" y="554" class="procText" xml:space="preserve">
  <tspan x="56" dy="0">for each source row:</tspan>
  <tspan x="56" dy="16">  filter higher bytes using idx rows when required</tspan>
  <tspan x="56" dy="16">  count selected byte values into 256 bins</tspan>
  <tspan x="56" dy="16">  write prefix sums to dst[row,0..255]</tspan>
</text>
<text x="56" y="680" class="meta">Note: semantics apply to the valid region unless stated otherwise.</text>
