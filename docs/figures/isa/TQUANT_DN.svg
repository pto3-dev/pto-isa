<text x="56" y="528" class="procTitle">Procedure (conceptual)</text>
<text x="56" y="554" class="procText" xml:space="preserve">
  <tspan x="56" dy="0">TQUANT&lt;0,...&gt; groups source rows along axis 0 in 32-row groups.</tspan>
  <tspan x="56" dy="16">dst keeps the source MxN RowMajor data layout after FP8/FP4 quantization.</tspan>
  <tspan x="56" dy="16">exp, max, and scaling use DN shape Mhat x N, not the Cube ZZ layout.</tspan>
  <tspan x="56" dy="16">Use TMOV&lt;0&gt;(expZZ, expDN, tmp) only when the exponent feeds MMAD_MX.</tspan>
</text>
<text x="56" y="680" class="meta">Note: semantics apply to the valid region unless stated otherwise.</text>
